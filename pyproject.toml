[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
mypy_path = "python"

[tool.cibuildwheel]
build = "cp310-*"
skip = "*-musllinux_*"
test-requires = ["pytest>=8", "mypy>=1.11"]
test-command = [
    "pytest {project}/python/tests",
    "mypy --config-file {project}/pyproject.toml {project}/python/pymimir {project}/python/tests/typing/api_usage.py",
]

[tool.cibuildwheel.linux]
before-all = [
    "dnf install -y clang curl libicu zlib-devel",
    "curl --fail --location --silent --show-error https://dot.net/v1/dotnet-install.sh --output /tmp/dotnet-install.sh",
    "bash /tmp/dotnet-install.sh --channel 10.0 --quality GA --install-dir /opt/dotnet",
]
environment = { DOTNET_ROOT = "/opt/dotnet", PATH = "/opt/dotnet:$PATH" }

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "12.0"
