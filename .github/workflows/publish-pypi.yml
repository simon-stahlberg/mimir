name: Publish Python package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag and package versions
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          def read_version(path: str, pattern: str) -> str:
              match = re.search(pattern, Path(path).read_text(encoding="utf-8"))
              if match is None:
                  raise RuntimeError(f"Version not found in {path}")
              return match.group(1)

          distribution_version = read_version("setup.py", r'version="([^"]+)"')
          package_version = read_version(
              "python/pymimir/__init__.py",
              r'__version__:\s*str\s*=\s*"([^"]+)"',
          )
          if package_version != distribution_version:
              raise RuntimeError(
                  f"Package version {package_version} does not match "
                  f"distribution version {distribution_version}"
              )

          actual_tag = os.environ["GITHUB_REF_NAME"]
          expected_tag = f"v{distribution_version}"
          if actual_tag != expected_tag:
              raise RuntimeError(f"Release tag must be {expected_tag}, got {actual_tag}")
          PY

  build-sdist:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and check source distribution
        run: |
          python -m pip install build==1.5.0 twine==7.0.0
          python -m build --sdist
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: pymimir-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: windows-x86_64
            os: windows-latest
            arch: AMD64
          - name: macos-x86_64
            os: macos-15-intel
            arch: x86_64
          - name: macos-arm64
            os: macos-15
            arch: arm64
    name: Build wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up .NET
        if: runner.os != 'Linux'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: ga

      - name: Build and test wheel
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: pymimir-wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  validate-artifacts:
    needs:
      - build-sdist
      - build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v5
        with:
          pattern: pymimir-*
          path: dist
          merge-multiple: true

      - name: Check release artifacts
        run: |
          python -m pip install twine==7.0.0
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path

          artifacts = sorted(path for path in Path("dist").iterdir() if path.is_file())
          source_distributions = [path for path in artifacts if path.name.endswith(".tar.gz")]
          wheels = [path for path in artifacts if path.suffix == ".whl"]
          if len(source_distributions) != 1 or len(wheels) != 4:
              names = ", ".join(path.name for path in artifacts)
              raise RuntimeError(f"Expected one sdist and four wheels, got: {names}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pymimir-release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: validate-artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymimir
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: pymimir-release
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
