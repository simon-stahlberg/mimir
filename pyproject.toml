[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
mypy_path = "python"

[tool.cibuildwheel]
build = "cp310-*"
skip = "*-musllinux_*"
test-requires = ["pytest>=8"]
test-command = "pytest {project}/python/tests/test_python_api.py"

[tool.cibuildwheel.linux]
before-all = [
    "dnf install -y clang curl zlib-devel",
    "curl --fail --location --silent --show-error https://dot.net/v1/dotnet-install.sh --output /tmp/dotnet-install.sh",
    "bash /tmp/dotnet-install.sh --channel 10.0 --quality GA --install-dir /opt/dotnet",
]
environment = { DOTNET_ROOT = "/opt/dotnet", PATH = "/opt/dotnet:$PATH" }
